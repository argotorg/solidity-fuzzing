// Protobuf schema for the SSA stack shuffler fuzzer; protoToShuffler.cpp projects it onto stack::shuffle()'s preconditions.

syntax = "proto2";

package solidity.yul.test.shuffler_fuzzer;

// Slot identity is (kind, id). V/PHI are SSA values that must already be on the stack (or spilled) to
// appear in a target; LIT, JUNK and CALL_RET are freely generatable; FUNC_RET is the function's return label.
message Slot {
  enum Kind {
    V = 0;
    PHI = 1;
    LIT = 2;
    JUNK = 3;
    CALL_RET = 4;
    FUNC_RET = 5;
  }
  required Kind kind = 1;
  required uint32 id = 2;
}

// Input to stack::shuffle(source, target, spills, allowSpilling, reachableDepth).
// target_mode FREE takes `target` as drawn; PERMUTED makes the target a permutation of
// `initial` (via `permutation`) with `target` entries of kind JUNK masking positions.
message ShuffleInput {
  enum TargetMode {
    FREE = 0;
    PERMUTED = 1;
  }
  repeated Slot initial = 1;
  repeated Slot target = 2;
  repeated Slot spilled = 3;
  optional bool allow_spilling = 4 [default = true];
  optional uint32 reachable_depth = 5 [default = 16];
  optional TargetMode target_mode = 6 [default = FREE];
  repeated uint32 permutation = 7;
}
